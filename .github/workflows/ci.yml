name: CI

on:
  push:
  pull_request:

jobs:
  deterministic:
    name: Deterministic tests and evaluation
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
      ENABLE_AUTONOMOUS_DELEGATION: "0"
      AGENT_MAX_PARALLEL_TASKS: "1"
      ENABLE_KNOWLEDGE_GRAPH: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run deterministic evaluation
        run: python -m evaluation

  live-mistral:
    name: Optional live Mistral test
    if: ${{ vars.RUN_LIVE_MISTRAL == 'true' }}
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MODEL_PROVIDER: mistral
      RUN_LIVE_MISTRAL_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live Mistral test
        run: python -m pytest tests/live/test_mistral_recovery.py
