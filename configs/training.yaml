training:
  epochs: 3
  learning_rate: 0.0002
  batch_size: 2
  gradient_accumulation_steps: 4

  max_sequence_length: 512

  logging_steps: 10
  save_steps: 100

  output_dir: "./models/checkpoints"

lora:
  r: 16
  alpha: 32
  dropout: 0.05

  bias: "none"
  task_type: "CAUSAL_LM"

  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj