model:
  provider: "huggingface"
  name: "Qwen/Qwen2.5-0.5B-Instruct"

device:
  type: "cuda"
  device_map: "auto"

quantization:
  enabled: true
  load_in_4bit: true
  compute_dtype: "float16"
  quant_type: "nf4"
  use_double_quant: true

tokenizer:
  trust_remote_code: true
  padding_side: "right"

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true